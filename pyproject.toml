[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clear-market"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=43,<50",
    "ortools==9.15.6755",
    "pydantic>=2,<3",
]

[project.scripts]
clear = "clear_market.cli:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6,<7",
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "setuptools>=69",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_config = true
strict_markers = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
